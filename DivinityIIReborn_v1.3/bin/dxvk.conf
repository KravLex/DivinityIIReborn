# DXVK settings for Divinity II: Developer's Cut (32-bit D3D9) - Divinity II Reborn
# Docs: https://github.com/doitsujin/dxvk/blob/master/dxvk.conf

# Texture memory (MB) DXVK keeps mapped in the 32-bit game process. Other textures stay in
# video memory only. Keeps the game far below its 4 GB limit even with 4x HD textures.
d3d9.textureMemory = 100

# The game sets 16x anisotropic filtering itself; do not override.
d3d9.samplerAnisotropy = -1

# FPS limit: 0 = off. Better: G-Sync/FreeSync + limit in the GPU driver, or Div2Patch FPSCap.
# If you need a limit here, set e.g. 141 (DXVK's own limiter paces frames less evenly).
d3d9.maxFrameRate = 0
