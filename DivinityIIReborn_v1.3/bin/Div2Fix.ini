; Div2Fix - исправления для Divinity II: Developer's Cut
; Файл лежит рядом с dinput8.dll в папке bin игры. 1 = включено, 0 = выключено.

[General]
; Писать журнал Div2Fix.log (что найдено и пропатчено при запуске)
Log=1
; Записывать в журнал, какие архивы .dv2 открывает игра (проверка, что патч-архивы с текстурами подключились)
LogArchives=0
; Предупреждение при запуске, если версия игры не та, что ставит Div2Patch (v1.4.700.56). 0 - не показывать.
VersionWarning=1

[KeyNames]
; Исправляет квадратики вместо клавиш в подсказках ("[(?)]") при русской раскладке.
; Названия клавиш берутся из английской раскладки (она должна быть установлена в Windows).
Enable=1
; Код языка раскладки для названий клавиш: 0x0409 = английский (США) = 1033
LanguageId=1033

[UIAspect]
; На мониторах шире 16:9 (21:9, 32:9) меню рисуются в центре в пропорции 16:9,
; как задумано в игре. HUD, курсор, цифры урона и подписи над врагами остаются на всю ширину.
Enable=1
; Какие окна интерфейса сужать до 16:9 (имена .swf без расширения, через запятую).
; Звёздочка "*" = все окна, включая HUD (не рекомендуется: метки над врагами могут сместиться).
; Если какое-то окно ведёт себя странно (например, подсказка уезжает от предмета) - уберите его из списка.
Movies=menuOverview,tacticalPause,options,questLog,skillTree,equipment,equipmentPopup,inventory,trade,chest,book,mainmap,mainMenu,characterCreation,humanCustomizing,colorCalibration,questReward,waypointShrine,summons,battletower_main,bt_alchemistgarden,bt_chest,bt_disenchant,bt_em_selection,bt_enchant,bt_necromancer,bt_skilltrainer,tooltip,contextMenu,loadingscreen,loadingscreen_still,simpleloadingscreen

[Graphics]
; Улучшения графики. Каждая правка сначала сверяет код игры; если версия игры другая - правка пропускается (см. Div2Fix.log).
Enable=1
; Дальность детализации и прорисовки объектов: 1 = как в игре, 2-4 = дальше (8 максимум). Больше = выше нагрузка.
LODDistanceMultiplier=3
; Разрешение карты теней при качестве теней "Высокое" (ShadowQuality 3): 4096 = как в игре, 8192 = в 2 раза чётче.
ShadowMapSize=8192
; Дальность теней (метры игры): 200 = как в игре. 300 - тени видны дальше, ближние не теряют чёткость при 8192.
ShadowDistance=300
; Распределение чёткости теней: 0.75 = как в игре; больше - чётче вблизи, меньше - чётче вдали.
ShadowSplitWeight=0.75
; 1 = все объекты отбрасывают тени во всех каскадах (больше теней вдали), 0 = как в игре.
ShadowAllObjects=1
; Мягкие края теней: исправляет размытие карты теней в игре (второй проход терял "разброс" глубины,
; из-за чего края были жёсткими и ступенчатыми, а листва мерцала). 1 = ширина размытия как в игре,
; больше - мягче (1.5, 2), 0 - выключить (как в оригинальной игре).
ShadowSoftness=1
; Свечение ярких мест (bloom) и лучи от солнца считаются в буферах вдвое больше - без "кубиков".
; 2 = вдвое больше (рекомендуется), 1 = как в игре.
BloomScale=2

[Diagnostics]
; Замер плавности (frametime). 1 = включено. Не влияет на игру, только измеряет.
; По умолчанию выключено (релиз). Включите, чтобы делать замеры по F11.
; В игре нажмите горячую клавишу - начнётся запись; нажмите ещё раз - запись остановится,
; рядом с игрой (в папке bin) появятся Div2Fix_perf_ДАТА.txt (отчёт) и .csv (все кадры).
Enable=0
; Код клавиши (Virtual-Key): 122 = F11, 121 = F10, 123 = F12
HotkeyVK=122
; Максимальная длина записи в минутах (1-120)
MaxMinutes=30
; Кадр считается "выбросом", если он дольше медианы в N процентов раз (200 = в 2 раза)
SpikeFactorPercent=200
; Сохранять CSV со временем каждого кадра (для графиков)
WriteCsv=1

[MindRead]
; Советник чтения мыслей: в окне "Чтение мыслей обойдётся вам в N опыта" добавляется строка-подсказка
; (без спойлеров): стоит ли тратить опыт. Данные - Div2Fix_mindread.txt. Игру и сохранения не меняет.
; Enable=0 - выключить совсем; Show=0 - только запись в Div2Fix.log.
Enable=1
Show=1
Dump=0

[Camera]
; Дальность камеры колёсиком мыши (работает вместе с Div2Patch, без него ничего не делает).
; Шаг = 0.25 от базового расстояния 3.75. ZoomOutSteps: на сколько шагов можно отъехать
; (Div2Patch: 10 = до 6.25; 30 = до 11.25). ZoomInSteps: приблизиться (1..14).
Enable=1
ZoomOutSteps=30
ZoomInSteps=10
; Шаг зума колёсиком (Div2Patch: 0.25). Больше - быстрее приближение/отдаление.
ZoomStep=0.25
; Расстояние камеры по умолчанию: дракон (Div2Patch: 7.0) и человек (3.75; действует только
; при DynamicCameraZoom="0" в Data\globalswitches.xml, иначе расстояние человека задаёт игра).
DragonDistance=7.0
HumanDistance=3.75

[Icons]
; Чёткие иконки (пакет HD-текстур, FOV_Patch_3.dv2): иконки 4x рисуются в исходном размере ячейки.
; Без HD-иконок ничего не меняет. Enable=0 - выключить.
Enable=1

[Intro]
; Skip=1 - не показывать заставку с логотипами при запуске игры (Data\Video\intro.wmv).
; Сюжетные ролики и видео умений не затрагиваются. 0 - как в оригинальной игре.
Skip=1

[UIText]
; Русские буквы в подписях флажков на карте мира (и другом тексте меню, который игра передаёт
; в старой кодировке) вместо квадратиков. Правильный текст не трогается. Enable=0 - выключить.
Enable=1
; Log=1 - записать в Div2Fix.log первые 30 исправленных строк
Log=1

[Input]
; Если одновременно зажаты "влево" и "вправо" (A и D, или стрелки), персонаж не идёт влево,
; как в оригинале, а стоит; отпустили одну - работает другая. Только для клавиш по умолчанию.
StrafeBothCancel=1

[Window]
; Icon=1 - у окна игры и на панели задач иконка игры (как у ярлыка Steam) вместо пустой.
Icon=1
; KeyboardShared=1 - переключение раскладки (Alt+Shift, Ctrl+Shift, Win+Пробел) работает
; прямо в игре, например для подписей флажков на карте. 0 - как в оригинальной игре.
KeyboardShared=1
